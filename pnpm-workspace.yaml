# Solo esbuild necesita ejecutar su script de instalación (descarga el binario nativo).
allowBuilds:
  esbuild: true

# eslint-plugin-obsidianmd declara obsidian@1.8.7 como peer exacto; usamos tipos más nuevos.
strictPeerDependencies: false

# Versiones más recientes que la antigüedad mínima de publicación configurada en pnpm.
minimumReleaseAgeExclude:
  - vite@8.3.2
  - '@agentclientprotocol/sdk@1.6.0'
